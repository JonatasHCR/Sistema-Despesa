services:

  db:
    # Porta no host para conectar via DBeaver/psql local.
    ports:
      - "127.0.0.1:5432:5432"
    # Bind mount na pasta local com os dados reais, no lugar do volume nomeado.
    volumes:
      - ./postgres_data_prod:/var/lib/postgresql/data

  backend:
    # Hot reload: UVICORN_RELOAD ativa o --reload no CMD do Dockerfile.
    user: root
    volumes:
      - ./backend:/backend
    environment:
      UVICORN_RELOAD: "1"

  frontend:
    # Estágio "deps" (sem build) + next dev com bind mount.
    build:
      target: deps
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
