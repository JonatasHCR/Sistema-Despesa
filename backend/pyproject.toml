[project]
name = "backend"
version = "0.1.0"
description = "API do Sistema Despesa (SISTEMA RADAR) — FastAPI + SQLAlchemy async"
authors = [
    { name = "jonatashcr", email = "jonatas.reisprofissional@gmail.com" },
]
requires-python = ">=3.12,<4.0"
# Aplicação (não um pacote distribuível): Poetry só gerencia o ambiente.
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.30.0",
    "email-validator==2.3.0",
    "fastapi==0.116.1",
    "openpyxl==3.1.5",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "PyJWT[crypto]==2.9.0",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.20",
    "SQLAlchemy==2.0.41",
    "slowapi==0.1.9",
    "uvicorn==0.35.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "aiosqlite==0.21.0",
    "asgi-lifespan==2.1.0",
    "coverage==7.8.0",
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.1.1",
    "watchfiles==1.1.0",
    "ruff>=0.8.0,<1.0.0",
    "taskipy>=1.14.1,<2.0.0",
]

[tool.ruff]
line-length = 79
extend-exclude = ['alembic']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "service: Testes relacionados aos services",
    "integration: Testes de integração",
    "routers: Testes relacionados as rotas",
]

[tool.taskipy.tasks]
run = "uvicorn main:app --reload"
lint = "ruff check"
fix = "ruff check --fix"
format = "ruff format"
test = "pytest"
cov = "pytest --cov=app"
